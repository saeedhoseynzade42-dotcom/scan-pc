<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اسکن ماهواره</title>
<style>
:root{--bg:#0f141b;--pn:#161c25;--pn2:#1b232e;--bd:#2d3643;--tx:#e8eef5;--mu:#98a4b3;--ac:#2f7df6;--gr:#1f9d55;--rd:#a33a3a;--wn:#e0b25a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.7 Tahoma,"Segoe UI",system-ui,sans-serif}
header#top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--pn);border-bottom:1px solid var(--bd)}
.brand{font-weight:700;font-size:16px;letter-spacing:.3px}.sp{flex:1}
button,select,input{background:#0c1117;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;font:inherit;max-width:100%}
button{cursor:pointer}button:hover{border-color:#4a5a70}button.p{background:var(--ac);border-color:var(--ac)}button.g{background:var(--gr);border-color:var(--gr)}button.r{background:var(--rd);border-color:var(--rd)}
input[type=number]{width:90px}
label{color:var(--mu);font-size:13px;display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
nav#tabs{display:flex;gap:2px;padding:0 10px;background:var(--pn);overflow-x:auto;border-bottom:1px solid var(--bd)}
.tab{padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;color:var(--mu);white-space:nowrap}.tab.on{color:var(--tx);border-color:var(--ac)}
.tab b{display:inline-block;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:10px;background:#263040;margin-inline-end:6px;font-size:12px}
.tab.on b{background:var(--ac)}
main{padding:14px;max-width:1200px;margin:0 auto}
.hide{display:none!important}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0}
.card h3{margin:0 0 6px;font-size:15px}
.note{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin:8px 0}
.warn{border-color:#9e6a03;color:var(--wn)}.note:empty{display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
canvas{direction:ltr;max-width:100%;background:#000;border-radius:10px;border:1px solid var(--bd)}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:5px 8px;text-align:start}
.big{font-size:32px;text-align:center;direction:ltr;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.steps{margin:0;padding-inline-start:20px}.steps li{margin:6px 0}
progress{width:100%;height:10px}
#drop{border:2px dashed var(--bd);border-radius:12px;padding:26px;text-align:center;color:var(--mu);margin:10px 0}
#mapwrap{position:relative}
.mctl{position:absolute;top:10px;inset-inline-start:10px;display:flex;flex-direction:column;gap:6px}
.mctl button{width:42px;height:42px;font-size:20px;padding:0;background:rgba(15,20,27,.85)}
#mapwrap.fs{position:fixed;inset:0;z-index:100;background:#000}#mapwrap.fs canvas{border-radius:0;border:0}
input[type=search]{background:#0c1117;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;font:inherit}
.exp{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.exp h4{width:100%;margin:6px 0 0;font-size:13px;color:var(--mu);font-weight:600}
@media (max-width:600px){main{padding:10px}.tab{padding:9px 10px}input[type=number]{width:76px}}
</style></head>
<body>
<header id="top">
 <div class="brand" data-i18n="brand"></div>
 <button class="p" id="openBtn" data-i18n="open"></button><input type="file" id="fi" multiple accept=".csv,.txt,.okm" class="hide">
 <select id="dsSel" class="hide"></select>
 <span class="sp"></span>
 <select id="lang" aria-label="language"><option value="fa">فارسی</option><option value="ar">العربية</option><option value="tr">Türkçe</option><option value="en">English</option></select>
</header>
<nav id="tabs"></nav>
<main>
 <div id="drop" class="hide" data-i18n="drop"></div>

 <section id="v_guide" class="hide">
  <div class="card"><h3 data-i18n="guide_h"></h3>
   <ol class="steps"><li data-i18n="guide_1"></li><li data-i18n="guide_2"></li><li data-i18n="guide_3"></li><li data-i18n="guide_4"></li><li data-i18n="guide_5"></li></ol></div>
 </section>

 <section id="v_plan" class="hide">
  <div class="note" data-i18n="plan_intro"></div>
  <div id="plan_host"><div id="mapbox">
   <div class="row">
    <label><span data-i18n="plan_layer"></span><select id="mlayer"><option value="hyb" data-i18n="layer_hyb"></option><option value="sat" data-i18n="layer_sat"></option><option value="osm" data-i18n="layer_osm"></option></select></label>
    <input type="search" id="msearch" data-i18n-ph="search_ph" style="min-width:150px;flex:1"><button id="msbtn" data-i18n="search_btn"></button>
    <button onclick="myLoc()" data-i18n="plan_myloc"></button>
    <button onclick="$('kmlin').click()" data-i18n="plan_pin"></button><input type="file" id="kmlin" accept=".kml,.gpx" class="hide">
    <button class="p" id="drawBtn" data-i18n="draw_btn"></button>
   </div>
   <div id="mapwrap"><canvas id="c_pmap" width="800" height="520" style="width:100%;touch-action:none;cursor:crosshair"></canvas>
    <div class="mctl"><button id="mzin">+</button><button id="mzout">−</button><button id="mfs">⛶</button></div></div>
   <div class="note" id="mhint" data-i18n="plan_click"></div>
  </div></div>
  <div class="card"><h3 data-i18n="plan_set_h"></h3>
   <div class="row">
    <label>lat <input type="number" id="lat" step="0.000001" style="width:130px"></label>
    <label>lon <input type="number" id="lon" step="0.000001" style="width:130px"></label>
    <label><span data-i18n="heading"></span><input type="number" id="hd" value="90" step="1"></label>
   </div>
   <div class="row">
    <label><span data-i18n="plan_len"></span><input type="number" id="pl" value="30" min="1" step="any"></label>
    <label><span data-i18n="plan_wid"></span><input type="number" id="pw" value="30" min="0" step="any"></label>
    <label><span data-i18n="plan_step"></span><input type="number" id="ps" value="20" min="1" step="1"></label>
    <label><span data-i18n="plan_gap"></span><input type="number" id="pg" value="20" min="1" step="1"></label>
    <label><span data-i18n="plan_zig"></span><select id="pz"><option value="s" data-i18n="zig_snake"></option><option value="o" data-i18n="zig_one"></option></select></label>
    <button class="g" onclick="planMake(true)" data-i18n="plan_build"></button>
   </div>
   <div class="note" id="pinfo"></div>
   <div class="exp"><h4 data-i18n="plan_exp_h"></h4>
    <button class="p" onclick="expPlanTXT()" data-i18n="plan_txt"></button>
    <button onclick="planCSV()" data-i18n="plan_csv"></button><button onclick="planGPX()" data-i18n="plan_gpx"></button>
    <button onclick="planKML()" data-i18n="plan_kml"></button><button onclick="planKMLsq()" data-i18n="plan_kmlsq"></button>
    <button id="elevBtn" onclick="planElev()" data-i18n="plan_elev"></button>
    <button class="r" onclick="newProject()" data-i18n="new_project"></button></div>
   <div class="row"><button class="p" onclick="setTab('scan')" data-i18n="next_scan"></button></div>
  </div>
 </section>

 <section id="v_scan" class="hide">
  <div class="grid2">
  <div class="card" id="manual"><h3 data-i18n="man_h"></h3><div class="note" data-i18n="man_hint"></div>
   <div class="big" id="mpt">—</div><div id="mpos" style="text-align:center;color:var(--mu);direction:ltr"></div>
   <div class="row"><input type="number" id="mval" step="any" style="width:140px;font-size:18px"> <button class="g" id="mnext" data-i18n="man_next"></button>
    <button id="mprev" data-i18n="man_prev"></button><button id="mskip" data-i18n="man_skip"></button></div>
   <progress id="mprog" value="0" max="1"></progress><div id="mst" style="color:var(--mu)"></div>
   <div class="row"><button class="p" id="mfin" data-i18n="man_finish"></button></div>
  </div>
  <div class="card"><h3 data-i18n="file_h"></h3><div class="note" data-i18n="file_hint"></div>
   <div class="row"><button class="p" onclick="$('fi').click()" data-i18n="open"></button><button onclick="scanDemo()" data-i18n="live_demo"></button></div>
   </div>
  </div>
  <div class="card" id="live"><h3 data-i18n="live_h"></h3><div class="note" data-i18n="live_hint"></div>
   <div class="row">
    <label><span data-i18n="live_len"></span><input type="number" id="sl" value="20" min="0.5" step="0.5"></label>
    <label><span data-i18n="live_lines"></span><input type="number" id="sn" value="21" min="1" max="5000"></label>
    <label><span data-i18n="live_gap"></span><input type="number" id="sg" value="1" min="0.1" step="0.1"></label>
    <label><span data-i18n="live_dur"></span><input type="number" id="sd" value="40" min="3"></label>
   </div>
   <div class="big" id="sv">—</div><div id="ss"></div><div id="si" style="color:var(--mu)"></div>
   <canvas id="c_live" width="700" height="130" style="width:100%"></canvas>
   <div class="row"><button class="g" id="sgo" data-i18n="live_go"></button><button class="p" id="sfin" data-i18n="live_finish"></button>
    <button id="sundo" data-i18n="live_undo"></button><button id="ssave" data-i18n="live_save"></button><button class="r" id="sclear" data-i18n="live_clear"></button></div>
  </div>
 </section>

 <div id="subnav" class="row hide"></div>
 <div id="abar" class="card hide"><div class="row">
   <label><span data-i18n="dm"></span><select id="dm"><option value="proc" data-i18n="dm_proc"></option><option value="raw" data-i18n="dm_raw"></option><option value="local" data-i18n="dm_local"></option></select></label>
   <label><span data-i18n="zt"></span><input type="number" id="zt" value="2.5" step="0.5" min="0.2" max="30"></label>
   <label><span data-i18n="ztop"></span><input type="number" id="ztop" step="0.5" min="1" placeholder="auto" style="width:80px"></label>
   <label><span data-i18n="palette"></span><select id="pal"><option value="void" data-i18n="pal_void"></option><option value="metal" data-i18n="pal_metal"></option><option value="fill" data-i18n="pal_fill"></option></select></label>
   <label><span data-i18n="nlv"></span><input type="number" id="nlv" value="18" min="6" max="40" style="width:70px"></label>
   <label><input type="checkbox" id="tg" checked><span data-i18n="show_targets"></span></label>
   <label><span data-i18n="polarity"></span><select id="pol"><option value="abs" data-i18n="pol_abs"></option><option value="high" data-i18n="pol_high"></option><option value="low" data-i18n="pol_low"></option></select></label>
   <button class="p" id="runBtn" data-i18n="run"></button><span id="status" style="color:var(--mu)"></span></div>
  <div class="row"><span style="color:var(--mu)" data-i18n="cmap_h"></span><span id="cmap" style="display:inline-flex;gap:4px;flex-wrap:wrap"></span>
   <button id="cmrev" data-i18n="cm_rev"></button><button id="cmadd">+</button><button id="cmdel">−</button><button id="cmreset" data-i18n="cm_reset"></button></div></div>
 
 <div id="nodata" class="note hide"><span data-i18n="nodata"></span> <button onclick="setTab('scan')" data-i18n="nodata_go"></button></div>

 <section id="v_map" class="hide"><canvas id="c_map"></canvas></section>
 <section id="v_sat" class="hide">
  <div class="note" data-i18n="sat_intro"></div>
  <div id="sat_host"></div>
  <div class="row"><label><input type="checkbox" id="ovl" checked><span data-i18n="plan_overlay"></span></label></div>
 </section>

 <section id="v_d3" class="hide"><canvas id="c_3d" width="900" height="560" style="width:100%;touch-action:none"></canvas><div class="note" data-i18n="d3_hint"></div></section>
 <section id="v_solid" class="hide">
  <div class="row"><label><span data-i18n="iso"></span><input type="number" id="iso" value="2.5" step="0.5" min="0.5" max="40"></label>
   <label><span data-i18n="hscale"></span><input type="number" id="hs" value="0.7" step="0.25" min="0.25" max="4"></label>
   <label><span data-i18n="color"></span><select id="solcol"><option value="o" data-i18n="col_orange"></option><option value="h" data-i18n="col_hot"></option></select></label>
   <button onclick="render4D()" data-i18n="run"></button><button onclick="expSolidPNG()">PNG</button></div>
  <canvas id="c_solid" width="900" height="600" style="width:100%;touch-action:none"></canvas>
 </section>
 <section id="v_rep" class="hide">
  <div class="note" id="info"></div><div id="rep"></div>
 </section>
 <section id="v_exp" class="hide">
  <div class="card"><h3 data-i18n="exp_h"></h3>
   <div class="exp"><h4 data-i18n="exp_img"></h4><button onclick="expPNG()">PNG</button>
    <h4>Surfer</h4><button onclick="expGRD()">GRD</button><button onclick="expXYZ()" data-i18n="exp_xyz"></button><button onclick="expDAT()" data-i18n="exp_dat"></button><button onclick="expSurferPack()" data-i18n="exp_pack"></button>
    <h4>Voxler</h4><button onclick="expVox()">CSV (X,Y,Z,Data)</button>
    <h4>Google Earth</h4><button onclick="expKMLov()" data-i18n="exp_kmlov"></button>
    <h4>GPS Visualizer</h4><button onclick="expGPSV()" data-i18n="exp_gpsv"></button><button onclick="expGPX()" data-i18n="exp_gpx"></button>
    <h4 data-i18n="exp_targets"></h4><button onclick="expTargets()">CSV</button></div></div>
  <div class="note" data-i18n="exp_note"></div>
 </section>
</main>
<script>"use strict";
const D={
fa:{

"guide_1":"<b>1 المنطقة والشبكة:</b> اضغط «رسم المنطقة» على خريطة القمر الصناعي وارسم مستطيلاً بإصبعك أو بالفأرة. اكتب المسافة بين النقاط وبين الخطوط بالسنتيمتر. تُبنى الشبكة خطاً بخط بأسماء AA_001 … ويصبح ملف GPS Visualizer وGoogle Earth وGPX جاهزاً هناك.",

const PL={pts:[],nl:0,np:0};
function lineCode(l){const A=n=>String.fromCharCode(65+n%26);if(l<676)return A(Math.floor(l/26))+A(l);l-=676;return A(Math.floor(l/676))+A(Math.floor(l/26))+A(l)}
const planHasValues=()=>PL.pts.some(q=>Number.isFinite(q.v));
function planCount(){const L=+$("pl").value,W=+$("pw").value,g=(+$("pg").value)/100,st=(+$("ps").value)/100;if(!(L>0&&W>=0&&g>0&&st>0))return null;const nl=Math.floor(W/g+1e-9)+1,np=Math.floor(L/st+1e-9)+1;return{L,W,nl,np,tot:nl*np}}
function planPreview(){const c=planCount();if(!c){msg("pinfo","plan_bad",[],"warn");return}
 if(c.tot>100000)msg("pinfo","plan_many",[c.tot],"warn");else msg("pinfo","plan_prev",[c.nl,c.np,c.tot,(c.L*c.W).toFixed(0)]);drawMap()}
["pl","pw","pg","ps"].forEach(i=>$(i).addEventListener("input",planPreview));
function planMake(){
 const c=planCount();
 if(!geoValid()){msg("pinfo","plan_needloc",[],"warn");return}
 if(!c){msg("pinfo","plan_bad",[],"warn");return}
 const{L,W,nl,np,tot}=c,g=(+$("pg").value)/100,st=(+$("ps").value)/100,snake=$("pz").value==="s";
 if(tot>100000){msg("pinfo","plan_many",[tot],"warn");PL.pts=[];PL.nl=0;PL.np=0;drawMap();return}
 if(planHasValues()&&!confirm(t("restart_confirm")))return;
 const ll=toLLfn();PL.pts=[];Object.assign(PL,{nl,np,L,W,g,st});let seq=0;
 for(let l=0;l<nl;l++)for(let k=0;k<np;k++){const i=snake&&l%2?np-1-k:k,x=+(i*st).toFixed(4),y=+(l*g).toFixed(4),[la,lo]=ll(x,y);
  PL.pts.push({name:lineCode(l)+"_"+String(i+1).padStart(3,"0"),line:l,seq:++seq,x,y,lat:la,lon:lo})}
 msg("pinfo","plan_done",[tot,nl,np,L,((nl-1)*g).toFixed(1),Math.round(st*100),Math.round(g*100)]);
 $("sl").value=L;$("sn").value=nl;$("sg").value=g;$("sd").value=Math.max(5,Math.round(L/0.5));
 MN.i=0;
 fitMap();
 manualShow();drawMap();persist()}
function fitMap(){if(!geoValid())return;const L=+$("pl").value,W=+$("pw").value,la=+$("lat").value,diag=Math.max(L,W,1),cv=$("c_pmap");sizeMap();
 const mpp=diag/(0.6*Math.min(cv.width,cv.height)),z=Math.log2(40075016.686*Math.cos(la*Math.PI/180)/256/mpp),cc=toLLfn()(L/2,W/2);MP.z=Math.max(2,Math.min(20.5,z));MP.cl=cc[0];MP.co=cc[1]}

 PL.pts.forEach(q=>{k+=`<Placemark><name>${q.name}</name><styleUrl>#s</styleUrl><Polygon><outerBoundaryIs><LinearRing><coordinates>${c(q.x-hs,q.y-hs)} ${c(q.x+hs,q.y-hs)} ${c(q.x+hs,q.y+hs)} ${c(q.x-hs,q.y+hs)} ${c(q.x-hs,q.y-hs)}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>`});

async function planElev(){if(!PL.pts.length){alert(t("plan_first"));return}
 const n=9,ll=toLLfn(),la=[],lo=[];for(let j=0;j<n;j++)for(let i=0;i<n;i++){const p=ll(i/(n-1)*PL.L,j/(n-1)*Math.max(PL.W,0.01));la.push(p[0].toFixed(6));lo.push(p[1].toFixed(6))}
 msg("pinfo","calc");
 try{const r=await fetch("https://api.open-meteo.com/v1/elevation?latitude="+la.join(",")+"&longitude="+lo.join(","));const j=await r.json();const E=j.elevation;if(!Array.isArray(E)||E.length!==n*n)throw new Error("bad");
  const W=Math.max(PL.W,0.01);PL.pts.forEach(q=>{const fx=Math.min(n-1-1e-9,q.x/PL.L*(n-1)),fy=Math.min(n-1-1e-9,q.y/W*(n-1)),i=Math.floor(fx),jj=Math.floor(fy),ax=fx-i,ay=fy-jj,
   v=E[jj*n+i]*(1-ax)*(1-ay)+E[jj*n+i+1]*ax*(1-ay)+E[(jj+1)*n+i]*(1-ax)*ay+E[(jj+1)*n+i+1]*ax*ay;q.alt=v});
  msg("pinfo","elev_ok",[Math.min(...E).toFixed(0),Math.max(...E).toFixed(0)])}catch(e){msg("pinfo","elev_err","","warn")}}

 if(!tot){$("mpt").textContent="—";$("mpos").textContent="";msg("mst","man_need_plan");$("mprog").max=1;$("mprog").value=0;return}
 MN.i=Math.max(0,Math.min(tot-1,MN.i));const q=PL.pts[MN.i],done=PL.pts.filter(p=>Number.isFinite(p.v)).length;

 mv.value=Number.isFinite(q.v)?q.v:"";if(tab==="scan"&&!/Mobi|Android/i.test(navigator.userAgent))mv.focus();drawMap()}

/* ---------- live scan (phone magnetometer) ---------- */
const SC={rows:[],line:0,rec:false,cd:false,sensor:null,t0:0,dur:14,dir:1,L:7,gap:1,n:4,tr:[],timer:null};
function updInfo(){msg("si","live_info",[SC.line,SC.rows.length])}
function scanStartSensor(){
 if(SC.sensor)return true;
 try{if(!("Magnetometer" in window))throw new Error("no");
  const s=new Magnetometer({frequency:30});
  s.addEventListener("reading",()=>{$("sv").textContent=Math.hypot(s.x,s.y,s.z).toFixed(1)+" µT";if(SC.rec)scanSample(s)});
  s.addEventListener("error",e=>msg("ss","live_sensor_err",[(e.error&&e.error.name)||""]));
  s.start();SC.sensor=s;return true;
 }catch(e){msg("ss","live_nosensor","","warn");return false}
}
function scanSample(s){const f=Math.min(1,(performance.now()-SC.t0)/(SC.dur*1000)),x=SC.dir>0?f*SC.L:SC.L-f*SC.L,v=+Math.hypot(s.x,s.y,s.z).toFixed(3);
 SC.rows.push([SC.line,+x.toFixed(3),+(SC.line*SC.gap).toFixed(3),v,+s.x.toFixed(3),+s.y.toFixed(3),+s.z.toFixed(3),Date.now()]);SC.tr.push(v);drawLive();updInfo();if(f>=1)scanEndLine()}
$("sgo").onclick=scanGo;$("sfin").onclick=()=>scanFinish();$("sundo").onclick=scanUndo;$("ssave").onclick=scanSave;$("sclear").onclick=scanClear;
function scanGo(){
 if(SC.rec||SC.cd)return;if(!scanStartSensor())return;
 SC.L=+$("sl").value;SC.gap=+$("sg").value;SC.n=Math.max(1,Math.floor(+$("sn").value));SC.dur=+$("sd").value;
 if(!(SC.L>0&&SC.dur>0&&SC.gap>0)){msg("ss","live_bad","","warn");return}
 if(SC.line>=SC.n){msg("ss","live_alldone");return}
 try{if(navigator.wakeLock)navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}
 SC.dir=SC.line%2===0?1:-1;SC.tr=[];SC.cd=true;let c=3;
 const tick=()=>{if(c>0){msg("ss","live_cd",[SC.line+1,SC.n,c]);try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}c--;setTimeout(tick,1000)}
  else{SC.cd=false;SC.rec=true;SC.t0=performance.now();msg("ss","live_walk",[SC.line+1,SC.n]);SC.timer=setTimeout(()=>{if(SC.rec)scanEndLine()},SC.dur*1000+800)}};
 tick()}
function scanEndLine(){
 clearTimeout(SC.timer);SC.rec=false;const cnt=SC.rows.filter(r=>r[0]===SC.line).length;
 if(cnt<20){SC.rows=SC.rows.filter(r=>r[0]!==SC.line);msg("ss","live_few",[cnt],"warn");updInfo();return}
 SC.line++;try{navigator.vibrate&&navigator.vibrate([100,50,100])}catch(e){}updInfo();
 if(SC.line>=SC.n){msg("ss","live_analyzing");scanFinish()}else msg("ss","live_saved",[SC.line,cnt])}
function scanFinish(nm){
 if(SC.rec||SC.cd){msg("ss","live_wait");return}
 if(SC.rows.length<30){msg("ss","live_need","","warn");return}
 const P=SC.rows.map(r=>({l:r[0],x:r[1],y:r[2],v:r[3]}));
 const d={type:"grid",kind:"field",name:typeof nm==="string"?nm:"live-scan-"+new Date().toTimeString().slice(0,5).replace(":","-"),P};
 DS.push(d);cur=d;tab="map";updateDS();setTab("map");run()}
function scanUndo(){if(SC.rec||SC.cd||!SC.line)return;SC.line--;SC.rows=SC.rows.filter(r=>r[0]!==SC.line);SC.tr=[];drawLive();updInfo();msg("ss","live_undone")}
function scanClear(){if(SC.rec||SC.cd)return;if(SC.rows.length&&!confirm(t("live_clear_confirm")))return;SC.rows=[];SC.line=0;SC.tr=[];drawLive();updInfo();msg("ss","")}
function scanSave(){if(!SC.rows.length){msg("ss","live_nosave");return}
 save("field_scan_"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")+".csv","line,x,y,value,mx,my,mz,t\n"+SC.rows.map(r=>r.join(",")).join("\n"),"text/csv")}
function drawLive(){const cv=$("c_live"),c=cv.getContext("2d");c.fillStyle="#05080c";c.fillRect(0,0,cv.width,cv.height);const tr=SC.tr;if(tr.length<2)return;
 let a=Math.min(...tr),b=Math.max(...tr);if(b-a<1e-6){a-=1;b+=1}c.strokeStyle="#19d3e6";c.lineWidth=2;c.beginPath();
 tr.forEach((v,i)=>{const x=i/Math.max(tr.length-1,1)*(cv.width-10)+5,y=cv.height-8-(v-a)/(b-a)*(cv.height-16);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();
 c.fillStyle="#9aa4af";c.font="12px sans-serif";c.fillText(a.toFixed(1)+" … "+b.toFixed(1)+" µT",8,14)}
function scanDemo(){
 if(SC.rec||SC.cd)return;if(SC.rows.length&&!confirm(t("live_demo_confirm")))return;
 const L=+$("sl").value||20,gap=+$("sg").value||1,n=Math.max(2,Math.floor(+$("sn").value)||4),N=Math.max(60,Math.min(420,Math.round(L*10)));let seed=7;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
 SC.rows=[];SC.line=0;SC.L=L;SC.gap=gap;SC.n=n;
 for(let l=0;l<n;l++){for(let i=0;i<N;i++){const x=i/(N-1)*L,y=l*gap,nz=(rnd()+rnd()+rnd()-1.5)*0.5,dr=0.4*Math.sin(l*1.3+x*0.35),an=8*Math.exp(-(((x-L/2)**2+(y-(n-1)*gap/2)**2)/(2*(0.07*L+0.3)**2)));
   const v=48+dr+nz+an;SC.rows.push([l,+x.toFixed(3),+y.toFixed(3),+v.toFixed(3),0,0,+v.toFixed(3),0])}}
 SC.line=n;updInfo();scanFinish("demo-synthetic")}

function expSurferPack(){if(!cur||!cur.map){alert(t("need_scan"));return}
 const n=safeName(cur.name);save(n+".grd",grdStr(),"text/plain");
 let lab="X,Y,Label\n";cur.targets.slice(0,50).forEach(q=>{lab+=`${q.x.toFixed(3)},${q.y.toFixed(3)},T${q.id}\n`});save(n+"_labels.dat",lab,"text/plain");
 const bas=`'==========================================================================
' ${n}_autobuild.bas  (ScanAnalyzer)
' 1) Put ${n}.grd and ${n}_labels.dat in ONE folder.
' 2) Edit FolderPath below (keep the trailing backslash).
' 3) Open Surfer > Automation > Scripter, open this file, click Script > Run.
' Builds a filled contour map with target labels and saves ${n}.srf.
' Grid units are metres from the scan start corner (0,0).
'==========================================================================
Sub Main
  Dim FolderPath As String
  FolderPath = "C:\\Users\\YOUR_NAME\\Downloads\\"   ' <-- EDIT THIS PATH
  Dim SurferApp As Object
  Set SurferApp = CreateObject("Surfer.Application")
  SurferApp.Visible = True
  Dim Plot As Object
  Set Plot = SurferApp.Documents.Add
  Dim MapFrame As Object, ContourLayer As Object
  Set MapFrame = Plot.Shapes.AddContourMap(GridFileName:=FolderPath & "${n}.grd")
  Set ContourLayer = MapFrame.Overlays(1)
  ContourLayer.FillContours = True
  ContourLayer.FillForegroundColorMap.LoadPreset("Rainbow")
  ContourLayer.ApplyFillToLevels(1, 1, 0)
  On Error Resume Next
  Dim PostFrame As Object, PostLayer As Object
  Set PostFrame = Plot.Shapes.AddPostMap(FolderPath & "${n}_labels.dat", LabCol:=3)
  If Not PostFrame Is Nothing Then
    Set PostLayer = PostFrame.Overlays(1)
    PostLayer.LabelFont.Bold = True
    PostLayer.LabelFont.Size = 10
    Plot.Shapes.SelectAll
    Plot.Selection.OverlayMaps
    Plot.Selection.DeselectAll
  End If
  On Error GoTo 0
  Plot.SaveAs (FileName:=FolderPath & "${n}.srf")
End Sub
`;save(n+"_autobuild.bas",bas.replace(/\n/g,"\r\n"),"text/plain")}


/* ---------- autosave ---------- */
function persist(){try{const vals=[];PL.pts.forEach((q,i)=>{if(Number.isFinite(q.v))vals.push([i,q.v])});localStorage.setItem("sa_proj2",JSON.stringify({inp:Object.fromEntries(["lat","lon","hd","pl","pw","pg","ps","pz"].map(k=>[k,$(k).value])),built:PL.pts.length>0,vals,i:MN.i}))}catch(e){}}
function restoreProject(){try{const j=JSON.parse(localStorage.getItem("sa_proj2")||"null");if(!j)return;for(const k in j.inp)$(k).value=j.inp[k];
 if(geoValid()){MP.cl=+$("lat").value;MP.co=+$("lon").value;MP.z=17}
 if(j.built){planMake();j.vals.forEach(([i,v])=>{if(PL.pts[i])PL.pts[i].v=v});MN.i=j.i||0;manualShow();msg("mhint","restored");persist()}else drawMap()}catch(e){}}
function newProject(){if(!confirm(t("new_confirm")))return;try{localStorage.removeItem("sa_proj2")}catch(e){}PL.pts=[];PL.nl=0;PL.np=0;MN.i=0;msg("pinfo","");msg("mhint","plan_click");manualShow();drawMap()}
["pl","pw","pg","ps","pz","lat","lon","hd"].forEach(i=>$(i).addEventListener("change",persist));

(()=>{let l="fa";try{const s=localStorage.getItem("sa_lang");if(s&&D[s])l=s}catch(e){}tab="guide";applyLang(l);cmapDraw();restoreProject()})();
