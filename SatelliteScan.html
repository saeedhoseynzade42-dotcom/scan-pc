<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اسکن ماهواره</title>
<style>
:root{--bg:#0f141b;--pn:#161c25;--pn2:#1b232e;--bd:#2d3643;--tx:#e8eef5;--mu:#98a4b3;--ac:#2f7df6;--gr:#1f9d55;--rd:#a33a3a;--wn:#e0b25a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.7 Tahoma,"Segoe UI",system-ui,sans-serif}
header#top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--pn);border-bottom:1px solid var(--bd)}
.brand{font-weight:700;font-size:16px;letter-spacing:.3px}.sp{flex:1}
button,select,input{background:#0c1117;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;font:inherit;max-width:100%}
button{cursor:pointer}button:hover{border-color:#4a5a70}button.p{background:var(--ac);border-color:var(--ac)}button.g{background:var(--gr);border-color:var(--gr)}button.r{background:var(--rd);border-color:var(--rd)}
input[type=number]{width:90px}
label{color:var(--mu);font-size:13px;display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
nav#tabs{display:flex;gap:2px;padding:0 10px;background:var(--pn);overflow-x:auto;border-bottom:1px solid var(--bd)}
.tab{padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;color:var(--mu);white-space:nowrap}.tab.on{color:var(--tx);border-color:var(--ac)}
.tab b{display:inline-block;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:10px;background:#263040;margin-inline-end:6px;font-size:12px}
.tab.on b{background:var(--ac)}
main{padding:14px;max-width:1200px;margin:0 auto}
.hide{display:none!important}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0}
.card h3{margin:0 0 6px;font-size:15px}
.note{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin:8px 0}
.warn{border-color:#9e6a03;color:var(--wn)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
canvas{direction:ltr;max-width:100%;background:#000;border-radius:10px;border:1px solid var(--bd)}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:5px 8px;text-align:start}
.big{font-size:32px;text-align:center;direction:ltr;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.steps{margin:0;padding-inline-start:20px}.steps li{margin:6px 0}
progress{width:100%;height:10px}
#drop{border:2px dashed var(--bd);border-radius:12px;padding:26px;text-align:center;color:var(--mu);margin:10px 0}
#mapwrap{position:relative}
.mctl{position:absolute;top:10px;inset-inline-start:10px;display:flex;flex-direction:column;gap:6px}
.mctl button{width:42px;height:42px;font-size:20px;padding:0;background:rgba(15,20,27,.85)}
#mapwrap.fs{position:fixed;inset:0;z-index:100;background:#000}#mapwrap.fs canvas{border-radius:0;border:0}
input[type=search]{background:#0c1117;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;font:inherit}
.exp{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.exp h4{width:100%;margin:6px 0 0;font-size:13px;color:var(--mu);font-weight:600}
@media (max-width:600px){main{padding:10px}.tab{padding:9px 10px}input[type=number]{width:76px}}
</style></head>
<body>
<header id="top">
 <div class="brand" data-i18n="brand"></div>
 <button class="p" id="openBtn" data-i18n="open"></button><input type="file" id="fi" multiple accept=".csv,.txt,.okm" class="hide">
 <select id="dsSel" class="hide"></select>
 <span class="sp"></span>
 <select id="lang" aria-label="language"><option value="fa">فارسی</option><option value="ar">العربية</option><option value="tr">Türkçe</option><option value="en">English</option></select>
</header>
<nav id="tabs"></nav>
<main>
 <div id="drop" class="hide" data-i18n="drop"></div>

 <section id="v_guide" class="hide">
  <div class="card"><h3 data-i18n="guide_h"></h3>
   <ol class="steps"><li data-i18n="guide_1"></li><li data-i18n="guide_2"></li><li data-i18n="guide_3"></li><li data-i18n="guide_4"></li><li data-i18n="guide_5"></li></ol></div>
 </section>

 <section id="v_plan" class="hide">
  <div class="note" data-i18n="plan_intro"></div>
  <div class="row">
   <label><span data-i18n="plan_layer"></span><select id="mlayer"><option value="hyb" data-i18n="layer_hyb"></option><option value="sat" data-i18n="layer_sat"></option><option value="osm" data-i18n="layer_osm"></option></select></label>
   <input type="search" id="msearch" data-i18n-ph="search_ph" style="min-width:150px;flex:1"><button id="msbtn" data-i18n="search_btn"></button>
   <button onclick="myLoc()" data-i18n="plan_myloc"></button>
   <button onclick="$('kmlin').click()" data-i18n="plan_pin"></button><input type="file" id="kmlin" accept=".kml,.gpx" class="hide">
  </div>
  <div id="mapwrap"><canvas id="c_pmap" width="800" height="520" style="width:100%;touch-action:none;cursor:crosshair"></canvas>
   <div class="mctl"><button id="mzin">+</button><button id="mzout">−</button><button id="mfs">⛶</button></div></div>
  <div class="note" id="mhint" data-i18n="plan_click"></div>
  <div class="row">
   <label>lat <input type="number" id="lat" step="0.000001" style="width:130px"></label>
   <label>lon <input type="number" id="lon" step="0.000001" style="width:130px"></label>
   <label><span data-i18n="heading"></span><input type="number" id="hd" value="0" step="1"></label>
  </div>
  <div class="card"><div class="row">
   <label><span data-i18n="plan_len"></span><input type="number" id="pl" value="20" min="1"></label>
   <label><span data-i18n="plan_wid"></span><input type="number" id="pw" value="20" min="0"></label>
   <label><span data-i18n="plan_gap"></span><input type="number" id="pg" value="1" min="0.1" step="0.1"></label>
   <label><span data-i18n="plan_step"></span><input type="number" id="ps" value="1" min="0.1" step="0.1"></label>
   <button class="g" onclick="planMake()" data-i18n="plan_build"></button>
  </div>
  <div class="note" id="pinfo"></div>
  <div class="row"><button class="r" onclick="newProject()" data-i18n="new_project"></button><button onclick="planCSV()" data-i18n="plan_csv"></button><button onclick="planGPX()" data-i18n="plan_gpx"></button><button onclick="planKML()" data-i18n="plan_kml"></button>
   <label><input type="checkbox" id="ovl" checked><span data-i18n="plan_overlay"></span></label></div></div>
 </section>

 <section id="v_scan" class="hide">
  <div class="grid2">
  <div class="card" id="manual"><h3 data-i18n="man_h"></h3><div class="note" data-i18n="man_hint"></div>
   <div class="big" id="mpt">—</div><div id="mpos" style="text-align:center;color:var(--mu);direction:ltr"></div>
   <div class="row"><input type="number" id="mval" step="any" style="width:140px;font-size:18px"> <button class="g" id="mnext" data-i18n="man_next"></button>
    <button id="mprev" data-i18n="man_prev"></button><button id="mskip" data-i18n="man_skip"></button></div>
   <progress id="mprog" value="0" max="1"></progress><div id="mst" style="color:var(--mu)"></div>
   <div class="row"><button class="p" id="mfin" data-i18n="man_finish"></button></div>
  </div>
  <div class="card"><h3 data-i18n="file_h"></h3><div class="note" data-i18n="file_hint"></div>
   <div class="row"><button class="p" onclick="$('fi').click()" data-i18n="open"></button><button onclick="scanDemo()" data-i18n="live_demo"></button></div>
   </div>
  </div>
  <div class="card" id="live"><h3 data-i18n="live_h"></h3><div class="note" data-i18n="live_hint"></div>
   <div class="row">
    <label><span data-i18n="live_len"></span><input type="number" id="sl" value="20" min="0.5" step="0.5"></label>
    <label><span data-i18n="live_lines"></span><input type="number" id="sn" value="21" min="1" max="60"></label>
    <label><span data-i18n="live_gap"></span><input type="number" id="sg" value="1" min="0.1" step="0.1"></label>
    <label><span data-i18n="live_dur"></span><input type="number" id="sd" value="40" min="3"></label>
   </div>
   <div class="big" id="sv">—</div><div id="ss"></div><div id="si" style="color:var(--mu)"></div>
   <canvas id="c_live" width="700" height="130" style="width:100%"></canvas>
   <div class="row"><button class="g" id="sgo" data-i18n="live_go"></button><button class="p" id="sfin" data-i18n="live_finish"></button>
    <button id="sundo" data-i18n="live_undo"></button><button id="ssave" data-i18n="live_save"></button><button class="r" id="sclear" data-i18n="live_clear"></button></div>
  </div>
 </section>

 <div id="abar" class="card hide"><div class="row">
   <label><span data-i18n="zt"></span><input type="number" id="zt" value="2.5" step="0.5" min="1" max="30"></label>
   <label><span data-i18n="palette"></span><select id="pal"><option value="void" data-i18n="pal_void"></option><option value="metal" data-i18n="pal_metal"></option></select></label>
   <label><span data-i18n="polarity"></span><select id="pol"><option value="abs" data-i18n="pol_abs"></option><option value="high" data-i18n="pol_high"></option><option value="low" data-i18n="pol_low"></option></select></label>
   <button class="p" id="runBtn" data-i18n="run"></button><span id="status" style="color:var(--mu)"></span></div></div>
 <div id="nodata" class="note hide"><span data-i18n="nodata"></span> <button onclick="setTab('scan')" data-i18n="nodata_go"></button></div>

 <section id="v_map" class="hide"><canvas id="c_map"></canvas></section>
 <section id="v_d3" class="hide"><canvas id="c_3d" width="900" height="560" style="width:100%;touch-action:none"></canvas><div class="note" data-i18n="d3_hint"></div></section>
 <section id="v_solid" class="hide">
  <div class="row"><label><span data-i18n="iso"></span><input type="number" id="iso" value="2.5" step="0.5" min="0.5" max="40"></label>
   <label><span data-i18n="hscale"></span><input type="number" id="hs" value="0.7" step="0.25" min="0.25" max="4"></label>
   <label><span data-i18n="color"></span><select id="solcol"><option value="o" data-i18n="col_orange"></option><option value="h" data-i18n="col_hot"></option></select></label>
   <button onclick="render4D()" data-i18n="run"></button><button onclick="expSolidPNG()">PNG</button></div>
  <canvas id="c_solid" width="900" height="600" style="width:100%;touch-action:none"></canvas>
 </section>
 <section id="v_rep" class="hide">
  <div class="note" id="info"></div><div id="rep"></div>
  <div class="card"><h3 data-i18n="exp_h"></h3>
   <div class="exp"><h4 data-i18n="exp_img"></h4><button onclick="expPNG()">PNG</button>
    <h4>Surfer</h4><button onclick="expGRD()">GRD</button><button onclick="expXYZ()" data-i18n="exp_xyz"></button><button onclick="expSurferPack()" data-i18n="exp_pack"></button>
    <h4>Voxler</h4><button onclick="expVox()">CSV (X,Y,Z,Data)</button>
    <h4>Google Earth</h4><button onclick="expKMLov()" data-i18n="exp_kmlov"></button>
    <h4>GPS Visualizer</h4><button onclick="expGPSV()" data-i18n="exp_gpsv"></button><button onclick="expGPX()" data-i18n="exp_gpx"></button>
    <h4 data-i18n="exp_targets"></h4><button onclick="expTargets()">CSV</button></div></div>
 </section>
</main>
<script>

const D={

/* ---------- utils ---------- */
const med=a=>{const b=Float64Array.from(a).sort();const n=b.length;return n?(n&1?b[n>>1]:(b[n/2-1]+b[n/2])/2):0};

function hex(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function hx(c){return"#"+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("")}

 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let a=0;for(let i=-r;i<=r;i++){const xx=Math.min(W-1,Math.max(0,x+i));a+=k[i+r]*F[y*W+xx]}A[y*W+x]=a}
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let a=0;for(let i=-r;i<=r;i++){const yy=Math.min(H-1,Math.max(0,y+i));a+=k[i+r]*A[yy*W+x]}B[y*W+x]=a}return B}
const safeName=n=>{const r=String(n).replace(/\.[^.]*$/,"").replace(/[^A-Za-z0-9_-]+/g,"_").replace(/^[_-]+|[_-]+$/g,"");return /[A-Za-z0-9]/.test(r)?r:"scan"};

/* ---------- parsers ---------- */
function parseOKM(buf,name){

 const find=(s,from=0)=>{const p=[...s].map(c=>c.charCodeAt(0));outer:for(let i=from;i<u.length-p.length;i++){for(let j=0;j<p.length;j++)if(u[i+j]!==p[j])continue outer;return i}return -1};
 const c=find("[CONC]"),d=find("[DT]");if(c<0||d<0)throw new Error(t("err_okm"));
 let n=dv.getInt32(c+12,true),lines=dv.getInt32(c+16,true),L=dv.getInt32(c+24,true),W=dv.getInt32(c+28,true);
 if(!(n>10&&n<5000&&lines>0&&lines<500))throw new Error(t("err_okm_params"));
 if(!(L>0&&L<500))L=7;if(!(W>0&&W<500))W=3;
 const total=n*lines,start=u.length-total*28;if(start<d)throw new Error(t("err_okm_size"));
 const S=[],T=[];for(let l=0;l<lines;l++){S.push([]);T.push([]);for(let i=0;i<n;i++){const o=start+(l*n+i)*28,ch=[];for(let k=0;k<10;k++)ch.push(dv.getInt16(o+k*2,true));S[l].push(ch);T[l].push(dv.getInt16(o+24,true)/1)}}

}
function parseCSV(text,name){
 const rows=text.split(/\r?\n/).filter(r=>r.trim());if(rows.length<20)throw new Error(t("err_short"));
 const del=[",",";","\t"].map(d=>[d,rows[0].split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
 const hdr=rows[0].split(del).map(s=>s.replace(/["']/g,"").trim().toLowerCase());
 const num=rows.slice(1).map(r=>r.split(del).map(v=>v.trim()===""?NaN:Number(v)));
 const ix=k=>hdr.indexOf(k);
 if(ix("line")>=0&&ix("x")>=0&&ix("y")>=0&&ix("value")>=0){
  const P=num.filter(r=>[ix("line"),ix("x"),ix("y"),ix("value")].every(c=>Number.isFinite(r[c]))).map(r=>({l:r[ix("line")],x:r[ix("x")],y:r[ix("y")],v:r[ix("value")]}));
  if(P.length<20)throw new Error(t("err_values",P.length));
  return{type:"grid",kind:"field",name,P};
 }
 let cx=ix("x"),cy=ix("y"),cz=ix("z"),cv=ix("data");if(cv<0)cv=ix("value");
 if(cx<0||cy<0||cz<0||cv<0){cx=0;cy=1;cz=2;cv=3}
 const P=[];for(const r of num){if([r[cx],r[cy],r[cz],r[cv]].every(Number.isFinite))P.push({x:r[cx],y:r[cy],z:r[cz],v:r[cv]})}

 const rad=P.map(p=>Math.hypot(p.x,p.y,p.z)),mr=med(rad),sd=Math.sqrt(rad.reduce((a,b)=>a+(b-mr)**2,0)/rad.length);
 if(mr>0&&sd/mr<0.02)throw new Error(t("err_sphere"));
 return{type:"grid",kind:"xyz",name,P:P.map(p=>({l:0,x:p.x,y:p.y,v:p.v}))};
}

/* ---------- analysis ---------- */
function analyzeGrid(d,zt){
 if(d.kind==="okm"){
  const{S,T,n,lines}=d;const w=(Math.max(11,Math.floor(n*0.35)))|1;
  const g=T.flat(),gm=med(g),gs=mad(g,gm)||1;
  const sig=[];for(let l=0;l<lines;l++){const arr=new Float64Array(n);
   for(let c=0;c<10;c++){const ch=Float64Array.from(S[l].map(r=>r[c])),bg=medfilt(ch,w);for(let i=0;i<n;i++)arr[i]+=(ch[i]-bg[i])/10}
   sig.push(l%2?Float64Array.from(arr).reverse():arr)}
  const bad=T.map((t_,l)=>{const a=t_.map(v=>Math.abs(v-gm)>4*gs);return l%2?a.reverse():a});
  const flat=[];sig.forEach((s,l)=>s.forEach((v,i)=>{if(!bad[l][i])flat.push(v)}));
  const b=med(flat),sc=mad(flat,b)||1;
  d.Zline=sig.map((s,l)=>Float64Array.from(s,(v,i)=>bad[l][i]?0:(v-b)/sc));
  d.scale=sc;d.badPct=100*bad.flat().filter(Boolean).length/(n*lines);
  const res=0.05,W=Math.round(d.L/res)+1,H=Math.max(2,Math.round(d.W/res)+1),F=new Float32Array(W*H);
  for(let j=0;j<H;j++){const yy=j*res,l0=Math.min(lines-2,Math.floor(yy/(d.W/(lines-1)))),fy=yy/(d.W/(lines-1))-l0;
   for(let i=0;i<W;i++){const xx=i*res,i0=Math.min(n-2,Math.floor(xx/(d.L/(n-1)))),fx=xx/(d.L/(n-1))-i0;
    const a=d.Zline[l0][i0]*(1-fx)+d.Zline[l0][i0+1]*fx,bb=d.Zline[l0+1][i0]*(1-fx)+d.Zline[l0+1][i0+1]*fx;F[j*W+i]=a*(1-fy)+bb*fy}}
  d.map={W,H,F:blurSep(F,W,H,2.4),x0:0,x1:d.L,y0:0,y1:d.W,res};
 }else{
  const P=d.P;const xs=P.map(p=>p.x),ys=P.map(p=>p.y);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const byL=new Map();P.forEach(p=>{if(!byL.has(p.l))byL.set(p.l,[]);byL.get(p.l).push(p)});
  for(const arr of byL.values()){const v=arr.map(p=>p.v),w=d.kind==="field"?(Math.min(401,Math.max(11,Math.floor(v.length*0.35)))|1):Math.min(61,(v.length>>1)*2-1||3),bg=medfilt(v,w);arr.forEach((p,i)=>{p.d=v[i]-bg[i]})}

  const span=Math.max(x1-x0,y1-y0)||1,res=span/220||0.05,W=Math.floor((x1-x0)/res)+1,H=Math.max(2,Math.floor((y1-y0)/res)+1);
  const ysu=[...new Set(P.map(p=>p.y.toFixed(3)))].map(Number).sort((a,b)=>a-b);let gap=0;if(ysu.length>1&&ysu.length<=200){const df=[];for(let i=1;i<ysu.length;i++)df.push(ysu[i]-ysu[i-1]);gap=med(df)}
  d.map=idw(P.map(p=>[p.x,p.y,p.z]),x0,x1,y0,y1,W,H,Math.max(res*3,gap*0.9),gap>0);

function idw(pts,x0,x1,y0,y1,W,H,rad,gauss){

 for(const p of pts){const ci=Math.min(gw-1,Math.max(0,Math.floor((p[0]-x0)/cell))),cj=Math.min(gh-1,Math.max(0,Math.floor((p[1]-y0)/cell)));bins[cj*gw+ci].push(p)}

 for(let j=0;j<H;j++)for(let i=0;i<W;i++){const x=x0+i*rx,y=y0+j*ry,bx=Math.floor((x-x0)/cell),by=Math.floor((y-y0)/cell);let nu=0,de=0;
  for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const xx=bx+a,yy=by+b;if(xx<0||yy<0||xx>=gw||yy>=gh)continue;for(const p of bins[yy*gw+xx]){const d2=(p[0]-x)**2+(p[1]-y)**2;if(d2>rad*rad)continue;const w=gauss?Math.exp(-d2/(2*(rad*0.55)**2)):1/(d2+(rad*0.05)**2);nu+=w*p[2];de+=w}}
  F[j*W+i]=de>0?nu/de:0}

function geoCtx(){if(!cur||!cur.map){alert(t("need_scan"));return null}if(!geoValid()){alert(t("need_latlon"));return null}return{toLL:toLLfn()}}
function bandPts(){const m=cur.map,zt=+$("zt").value,bi=bandInfo(m,zt,$("pal").value,$("pol").value),st=Math.max(1,Math.ceil(Math.sqrt(m.W*m.H/3000))),out=[];
 for(let j=0;j<m.H;j+=st)for(let i=0;i<m.W;i+=st){const v=bi.T[j*m.W+i];if(v<zt)continue;out.push({x:m.x0+i*m.res,y:m.y0+j*m.res,z:m.F[j*m.W+i],c:hx(bi.cols[bi.band(v)])})}return out}
function expGPSV(){const g=geoCtx();if(!g)return;const P=bandPts();if(!P.length){alert(t("no_above"));return}
 let s="name,desc,latitude,longitude,color,z\n";P.forEach((p,i)=>{const[la,lo]=g.toLL(p.x,p.y);s+=`P${i+1},z=${p.z.toFixed(1)},${la.toFixed(7)},${lo.toFixed(7)},${p.c},${p.z.toFixed(2)}\n`});
 save(safeName(cur.name)+"_gpsvisualizer.csv",s,"text/csv");
 if(cur.targets.length){let tx="name,desc,latitude,longitude,color\n";cur.targets.slice(0,30).forEach(q=>{const[la,lo]=g.toLL(q.x,q.y);tx+=`T${q.id},peak z=${q.pz.toFixed(1)} area=${q.area.toFixed(2)}m2,${la.toFixed(7)},${lo.toFixed(7)},#ff0000\n`});save(safeName(cur.name)+"_targets_gpsvisualizer.csv",tx,"text/csv")}}
function expGPX(){const g=geoCtx();if(!g)return;if(!cur.targets.length){alert(t("no_targets"));return}
 let s='<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="ScanAnalyzer" xmlns="http://www.topografix.com/GPX/1/1">';
 cur.targets.slice(0,100).forEach(q=>{const[la,lo]=g.toLL(q.x,q.y);s+=`<wpt lat="${la.toFixed(7)}" lon="${lo.toFixed(7)}"><name>T${q.id}</name><desc>peak z=${q.pz.toFixed(1)}, area=${q.area.toFixed(2)} m2</desc></wpt>`});
 save(safeName(cur.name)+"_targets.gpx",s+"</gpx>","application/gpx+xml")}
function expXYZ(){const g=geoCtx();if(!g)return;const m=cur.map;let s="Lon,Lat,Z\n";
 for(let j=0;j<m.H;j++)for(let i=0;i<m.W;i++){const[la,lo]=g.toLL(m.x0+i*m.res,m.y0+j*m.res);s+=`${lo.toFixed(7)},${la.toFixed(7)},${m.F[j*m.W+i].toFixed(3)}\n`}
 save(safeName(cur.name)+"_xyz_lonlat.csv",s,"text/csv")}
function expKMLov(){const g=geoCtx();if(!g)return;const off=document.createElement("canvas"),ok=renderSurfer(off,cur.map,+$("zt").value,$("pal").value,$("pol").value,{transparent:true});
 if(!ok){alert(t("no_above"));return}const m=cur.map,n=safeName(cur.name),c=(x,y)=>{const[la,lo]=g.toLL(x,y);return lo.toFixed(7)+","+la.toFixed(7)+",0"};
 off.toBlob(b=>{save(n+"_overlay.png",b,"image/png");
  save(n+"_overlay.kml",`<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2" xmlns:gx="http://www.google.com/kml/ext/2.2"><GroundOverlay><name>${n}</name><Icon><href>${n}_overlay.png</href></Icon><gx:LatLonQuad><coordinates>${c(m.x0,m.y0)} ${c(m.x1,m.y0)} ${c(m.x1,m.y1)} ${c(m.x0,m.y1)}</coordinates></gx:LatLonQuad></GroundOverlay></kml>`,"application/vnd.google-earth.kml+xml")},"image/png")}
function expSurferPack(){if(!cur||!cur.map){alert(t("need_scan"));return}
 const n=safeName(cur.name);save(n+".grd",grdStr(),"text/plain");
 let lab="X,Y,Label\n";cur.targets.slice(0,50).forEach(q=>{lab+=`${q.x.toFixed(3)},${q.y.toFixed(3)},T${q.id}\n`});save(n+"_labels.dat",lab,"text/plain");
 const bas=`'==========================================================================
' ${n}_autobuild.bas  (ScanAnalyzer)
' 1) Put ${n}.grd and ${n}_labels.dat in ONE folder.
' 2) Edit FolderPath below (keep the trailing backslash).
' 3) Open Surfer > Automation > Scripter, open this file, click Script > Run.
' Builds a filled contour map with target labels and saves ${n}.srf.
' Grid units are metres from the scan start corner (0,0).
'==========================================================================
Sub Main
  Dim FolderPath As String
  FolderPath = "C:\\Users\\YOUR_NAME\\Downloads\\"   ' <-- EDIT THIS PATH
  Dim SurferApp As Object
  Set SurferApp = CreateObject("Surfer.Application")
  SurferApp.Visible = True
  Dim Plot As Object
  Set Plot = SurferApp.Documents.Add
  Dim MapFrame As Object, ContourLayer As Object
  Set MapFrame = Plot.Shapes.AddContourMap(GridFileName:=FolderPath & "${n}.grd")
  Set ContourLayer = MapFrame.Overlays(1)
  ContourLayer.FillContours = True
  ContourLayer.FillForegroundColorMap.LoadPreset("Rainbow")
  ContourLayer.ApplyFillToLevels(1, 1, 0)
  On Error Resume Next
  Dim PostFrame As Object, PostLayer As Object
  Set PostFrame = Plot.Shapes.AddPostMap(FolderPath & "${n}_labels.dat", LabCol:=3)
  If Not PostFrame Is Nothing Then
    Set PostLayer = PostFrame.Overlays(1)
    PostLayer.LabelFont.Bold = True
    PostLayer.LabelFont.Size = 10
    Plot.Shapes.SelectAll
    Plot.Selection.OverlayMaps
    Plot.Selection.DeselectAll
  End If
  On Error GoTo 0
  Plot.SaveAs (FileName:=FolderPath & "${n}.srf")
End Sub
`;save(n+"_autobuild.bas",bas.replace(/\n/g,"\r\n"),"text/plain")}


/* ---------- autosave ---------- */
function persist(){try{const vals=[];PL.pts.forEach((q,i)=>{if(Number.isFinite(q.v))vals.push([i,q.v])});localStorage.setItem("sa_proj",JSON.stringify({inp:Object.fromEntries(["lat","lon","hd","pl","pw","pg","ps"].map(k=>[k,$(k).value])),built:PL.pts.length>0,vals,i:MN.i}))}catch(e){}}
function restoreProject(){try{const j=JSON.parse(localStorage.getItem("sa_proj")||"null");if(!j)return;for(const k in j.inp)$(k).value=j.inp[k];
 if(geoValid()){MP.cl=+$("lat").value;MP.co=+$("lon").value;MP.z=17}
 if(j.built){planMake();j.vals.forEach(([i,v])=>{if(PL.pts[i])PL.pts[i].v=v});MN.i=j.i||0;manualShow();msg("mhint","restored");persist()}else drawMap()}catch(e){}}
function newProject(){if(!confirm(t("new_confirm")))return;try{localStorage.removeItem("sa_proj")}catch(e){}PL.pts=[];PL.nl=0;PL.np=0;MN.i=0;msg("pinfo","");msg("mhint","plan_click");manualShow();drawMap()}
["pl","pw","pg","ps","lat","lon","hd"].forEach(i=>$(i).addEventListener("change",persist));

/* ---------- init ---------- */
(()=>{let l="fa";try{const s=localStorage.getItem("sa_lang");if(s&&D[s])l=s}catch(e){}tab="guide";applyLang(l);restoreProject()})();
</script></body></html>
