<body>

 <div id="drop">فایل را اینجا بکش یا دکمه «باز کردن فایل‌ها» را بزن. فرمت‌ها: .okm (دستگاه X55)، CSV با ستون‌های X,Y,Z,Data، یا CSV با ستون‌های line,x,y,value</div>
 <div id="views" class="hide">
  <div class="note" id="info"></div>

  <div id="v_3d" class="hide"><canvas id="c_3d" width="900" height="560"></canvas><div class="note">با ماوس بکش تا بچرخد؛ با چرخ ماوس زوم.</div></div>
  <div id="v_dir" class="hide"><canvas id="c_dir"></canvas></div>

 </div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const PAL={void:["#19d3e6","#ffffff","#d9d9d9","#8c8c8c","#4a4a4a","#000000","#ff7a00","#ffd400","#ff2fd0","#7a2cff","#18c46a"],
 metal:["#ffd400","#ff1a1a","#000000","#18a838","#ffffff","#8fe6c8","#2d6bff","#1b2cff","#ff1010","#b00000"]};
let DS=[],cur=null,tab="map",view={rx:-1.0,rz:0.6,zoom:1},lastMap=null;

/* ---------- utils ---------- */
const med=a=>{const b=Float64Array.from(a).sort();const n=b.length;return n?(n&1?b[n>>1]:(b[n/2-1]+b[n/2])/2):0};
const mad=(a,m)=>1.4826*med(a.map(v=>Math.abs(v-m)));
function medfilt(a,w){const h=w>>1,o=new Float64Array(a.length);for(let i=0;i<a.length;i++){const s=a.slice(Math.max(0,i-h),Math.min(a.length,i+h+1));o[i]=med(s)}return o}
function hex(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function blurSep(F,W,H,s){if(s<=0.3)return F;const r=Math.ceil(s*3),k=[];let t=0;for(let i=-r;i<=r;i++){const v=Math.exp(-i*i/(2*s*s));k.push(v);t+=v}
 for(let i=0;i<k.length;i++)k[i]/=t;const A=new Float32Array(F.length),B=new Float32Array(F.length);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let a=0;for(let i=-r;i<=r;i++){const xx=Math.min(W-1,Math.max(0,x+i));a+=k[i+r]*F[y*W+xx]}A[y*W+x]=a}
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let a=0;for(let i=-r;i<=r;i++){const yy=Math.min(H-1,Math.max(0,y+i));a+=k[i+r]*A[yy*W+x]}B[y*W+x]=a}return B}

/* ---------- parsers ---------- */
function parseOKM(buf,name){
 const u=new Uint8Array(buf),dv=new DataView(buf);
 const find=(s,from=0)=>{const p=[...s].map(c=>c.charCodeAt(0));outer:for(let i=from;i<u.length-p.length;i++){for(let j=0;j<p.length;j++)if(u[i+j]!==p[j])continue outer;return i}return -1};
 const c=find("[CONC]"),d=find("[DT]");if(c<0||d<0)throw new Error("ساختار فایل OKM شناخته نشد");
 let n=dv.getInt32(c+12,true),lines=dv.getInt32(c+16,true),L=dv.getInt32(c+24,true),W=dv.getInt32(c+28,true);
 if(!(n>10&&n<5000&&lines>0&&lines<500))throw new Error("پارامترهای اسکن در هدر فایل معتبر نبود");
 if(!(L>0&&L<500))L=7;if(!(W>0&&W<500))W=3;
 const total=n*lines,start=u.length-total*28;if(start<d)throw new Error("اندازه داده با هدر نمی‌خواند");
 const S=[],T=[];for(let l=0;l<lines;l++){S.push([]);T.push([]);for(let i=0;i<n;i++){const o=start+(l*n+i)*28,ch=[];for(let k=0;k<10;k++)ch.push(dv.getInt16(o+k*2,true));S[l].push(ch);T[l].push(dv.getInt16(o+24,true)/1)}}
 return{type:"grid",kind:"okm",name,S,T,n,lines,L,W};
}
function parseCSV(text,name){
 const rows=text.split(/\r?\n/).filter(r=>r.trim());if(rows.length<20)throw new Error("فایل خیلی کوتاه است");
 const del=[",",";","\t"].map(d=>[d,rows[0].split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
 const hdr=rows[0].split(del).map(s=>s.replace(/["']/g,"").trim().toLowerCase());
 const num=rows.slice(1).map(r=>r.split(del).map(Number));
 const ix=k=>hdr.indexOf(k);
 if(ix("line")>=0&&ix("x")>=0&&ix("y")>=0&&ix("value")>=0){
  const P=num.filter(r=>r.every(Number.isFinite)).map(r=>({l:r[ix("line")],x:r[ix("x")],y:r[ix("y")],v:r[ix("value")]}));
  return{type:"grid",kind:"field",name,P};
 }
 let cx=ix("x"),cy=ix("y"),cz=ix("z"),cv=ix("data");if(cv<0)cv=ix("value");
 if(cx<0||cy<0||cz<0||cv<0){cx=0;cy=1;cz=2;cv=3}
 const P=[];for(const r of num){if([r[cx],r[cy],r[cz],r[cv]].every(Number.isFinite))P.push({x:r[cx],y:r[cy],z:r[cz],v:r[cv]})}
 if(P.length<20)throw new Error("ردیف عددی معتبر کافی نیست");
 const rad=P.map(p=>Math.hypot(p.x,p.y,p.z)),mr=med(rad),sd=Math.sqrt(rad.reduce((a,b)=>a+(b-mr)**2,0)/rad.length);
 if(mr>0&&sd/mr<0.02)return{type:"sphere",name,P,R:mr};
 return{type:"grid",kind:"xyz",name,P:P.map(p=>({l:0,x:p.x,y:p.y,v:p.v}))};
}

/* ---------- analysis ---------- */
function analyzeSphere(d,zt,lk,useSat){
 const P=d.P,n=P.length;let cnt=new Map();for(const p of P)cnt.set(p.v,(cnt.get(p.v)||0)+1);
 let sv=null,sc=0;for(const[k,v]of cnt)if(v>sc){sc=v;sv=k}
 const hasSat=sc/n>0.15&&sc>20;d.satVal=hasSat?sv:null;
 for(const p of P){p.sat=hasSat&&p.v===sv;p.u=[p.x,p.y,p.z].map(a=>a/Math.hypot(p.x,p.y,p.z));p.az=Math.atan2(p.u[1],p.u[0])*180/Math.PI;p.el=Math.asin(Math.max(-1,Math.min(1,p.u[2])))*180/Math.PI}
 const use=P.filter(p=>useSat||!p.sat);if(use.length<10)throw new Error("نقاط معتبر کم است");
 const base=med(use.map(p=>p.v));let sc2=mad(use.map(p=>p.v),base);if(!sc2)sc2=1;
 for(const p of P)p.z=(useSat||!p.sat)?(p.v-base)/sc2:0;
 const an=P.filter(p=>(useSat||!p.sat)&&Math.abs(p.z)>zt);
 const par=an.map((_,i)=>i),find=a=>{while(par[a]!==a){par[a]=par[par[a]];a=par[a]}return a};
 const cs=Math.cos(lk*Math.PI/180);
 for(let i=0;i<an.length;i++)for(let j=i+1;j<an.length;j++){const a=an[i].u,b=an[j].u;if(a[0]*b[0]+a[1]*b[1]+a[2]*b[2]>=cs){const x=find(i),y=find(j);if(x!==y)par[x]=y}}
 const g=new Map();an.forEach((p,i)=>{const r=find(i);if(!g.has(r))g.set(r,[]);g.get(r).push(p)});
 const targets=[];for(const m of g.values()){if(m.length<4)continue;let c=[0,0,0],sc=0,pk=m[0];
  for(const p of m){const w=Math.abs(p.z);c[0]+=p.u[0]*w;c[1]+=p.u[1]*w;c[2]+=p.u[2]*w;sc+=w;if(w>Math.abs(pk.z))pk=p}
  const nn=Math.hypot(...c);c=c.map(a=>a/nn);const sp=Math.max(...m.map(p=>Math.acos(Math.min(1,p.u[0]*c[0]+p.u[1]*c[1]+p.u[2]*c[2]))*180/Math.PI));
  targets.push({n:m.length,az:Math.atan2(c[1],c[0])*180/Math.PI,el:Math.asin(c[2])*180/Math.PI,spread:sp,peak:pk.v,pz:pk.z,score:sc})}
 targets.sort((a,b)=>b.score-a.score);targets.forEach((t,i)=>t.id=i+1);
 // Moran I (kNN, k=8) with permutations
 const U=use.map(p=>Math.max(-10,Math.min(10,p.z))),m=use.length,K=8,nb=new Int32Array(m*K);
 if(m<=12000){for(let i=0;i<m;i++){const dd=[];const a=use[i].u;for(let j=0;j<m;j++){if(j===i)continue;const b=use[j].u;dd.push([-(a[0]*b[0]+a[1]*b[1]+a[2]*b[2]),j])}
   dd.sort((x,y)=>x[0]-y[0]);for(let k=0;k<K;k++)nb[i*K+k]=dd[k][1]}
  const stat=v=>{let mu=0;for(const x of v)mu+=x;mu/=m;let den=0,num=0;for(let i=0;i<m;i++){const dv=v[i]-mu;den+=dv*dv;let s=0;for(let k=0;k<K;k++)s+=v[nb[i*K+k]]-mu;num+=dv*s/K}return den?num/den:0};
  const obs=stat(U);let ge=0;const perm=U.slice();for(let r=0;r<99;r++){for(let i=m-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}if(stat(perm)>=obs)ge++}
  d.moran={I:obs,p:(ge+1)/100}}
 d.base=base;d.scale=sc2;d.targets=targets;d.zt=zt;
}
function analyzeGrid(d,zt,useSat){
 if(d.kind==="okm"){
  const{S,T,n,lines}=d;const w=(Math.max(11,Math.floor(n*0.35)))|1;const Z=[];
  const g=T.flat(),gm=med(g),gs=mad(g,gm)||1;
  const sig=[];for(let l=0;l<lines;l++){const arr=new Float64Array(n);
   for(let c=0;c<10;c++){const ch=Float64Array.from(S[l].map(r=>r[c])),bg=medfilt(ch,w);for(let i=0;i<n;i++)arr[i]+=(ch[i]-bg[i])/10}
   sig.push(l%2?Float64Array.from(arr).reverse():arr)}
  const bad=T.map((t,l)=>{const a=t.map(v=>Math.abs(v-gm)>4*gs);return l%2?a.reverse():a});
  const flat=[];sig.forEach((s,l)=>s.forEach((v,i)=>{if(!bad[l][i])flat.push(v)}));
  const b=med(flat),sc=mad(flat,b)||1;
  d.Zline=sig.map((s,l)=>Float64Array.from(s,(v,i)=>bad[l][i]?0:(v-b)/sc));
  d.scale=sc;d.badPct=100*bad.flat().filter(Boolean).length/(n*lines);
  d.x=[...Array(n)].map((_,i)=>i*d.L/(n-1));d.y=[...Array(lines)].map((_,l)=>lines>1?l*d.W/(lines-1):0);
  const res=0.05,W=Math.round(d.L/res)+1,H=Math.max(2,Math.round(d.W/res)+1),F=new Float32Array(W*H);
  for(let j=0;j<H;j++){const yy=j*res,l0=Math.min(lines-2,Math.floor(yy/(d.W/(lines-1)))),fy=yy/(d.W/(lines-1))-l0;
   for(let i=0;i<W;i++){const xx=i*res,i0=Math.min(n-2,Math.floor(xx/(d.L/(n-1)))),fx=xx/(d.L/(n-1))-i0;
    const a=d.Zline[l0][i0]*(1-fx)+d.Zline[l0][i0+1]*fx,bb=d.Zline[l0+1][i0]*(1-fx)+d.Zline[l0+1][i0+1]*fx;F[j*W+i]=a*(1-fy)+bb*fy}}
  d.map={W,H,F:blurSep(F,W,H,2.4),x0:0,x1:d.L,y0:0,y1:d.W,res,unit:"m"};
 }else{ // scattered points -> IDW grid
  const P=d.P;let xs=P.map(p=>p.x),ys=P.map(p=>p.y);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const byL=new Map();P.forEach(p=>{if(!byL.has(p.l))byL.set(p.l,[]);byL.get(p.l).push(p)});
  const z=[];for(const arr of byL.values()){const v=arr.map(p=>p.v),bg=medfilt(v,Math.min(61,(v.length>>1)*2-1||3));arr.forEach((p,i)=>{p.d=v[i]-bg[i]})}
  const dv=P.map(p=>p.d),b=med(dv),sc=mad(dv,b)||1;P.forEach(p=>p.z=(p.d-b)/sc);d.scale=sc;
  const res=Math.max((x1-x0),(y1-y0))/220||0.05,W=Math.floor((x1-x0)/res)+1,H=Math.max(2,Math.floor((y1-y0)/res)+1);d.map=idw(P.map(p=>[p.x,p.y,p.z]),x0,x1,y0,y1,W,H,res*3,"m");
 }
 d.targets=gridTargets(d.map,zt);d.zt=zt;
}
function idw(pts,x0,x1,y0,y1,W,H,rad,unit){
 const cell=rad,gw=Math.ceil((x1-x0)/cell)+1,gh=Math.ceil((y1-y0)/cell)+1,bins=Array.from({length:gw*gh},()=>[]);
 for(const p of pts){const ci=Math.min(gw-1,Math.max(0,Math.floor((p[0]-x0)/cell))),cj=Math.min(gh-1,Math.max(0,Math.floor((p[1]-y0)/cell)));bins[cj*gw+ci].push(p)}
 const F=new Float32Array(W*H),rx=(x1-x0)/(W-1||1),ry=(y1-y0)/(H-1||1);
 for(let j=0;j<H;j++)for(let i=0;i<W;i++){const x=x0+i*rx,y=y0+j*ry,bx=Math.floor((x-x0)/cell),by=Math.floor((y-y0)/cell);let nu=0,de=0;
  for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const xx=bx+a,yy=by+b;if(xx<0||yy<0||xx>=gw||yy>=gh)continue;for(const p of bins[yy*gw+xx]){const d2=(p[0]-x)**2+(p[1]-y)**2;if(d2>rad*rad)continue;const w=1/(d2+(rad*0.05)**2);nu+=w*p[2];de+=w}}
  F[j*W+i]=de>0?nu/de:0}
 return{W,H,F:blurSep(F,W,H,2),x0,x1,y0,y1,res:rx,unit};
}
function gridTargets(m,zt){const{W,H,F}=m,seen=new Uint8Array(W*H),out=[],minC=8;
 for(const sg of[1,-1]){seen.fill(0);for(let s=0;s<W*H;s++){if(seen[s]||sg*F[s]<=zt)continue;const st=[s];seen[s]=1;let n=0,sx=0,sy=0,pk=0,sc=0;
  while(st.length){const q=st.pop(),qx=q%W,qy=(q/W)|0;n++;sx+=qx;sy+=qy;const v=Math.abs(F[q]);sc+=v;if(v>Math.abs(pk))pk=F[q];
   for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=qx+dx,ny=qy+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const k=ny*W+nx;if(!seen[k]&&sg*F[k]>zt){seen[k]=1;st.push(k)}}}
  if(n>=minC)out.push({x:m.x0+sx/n*m.res,y:m.y0+sy/n*m.res,area:n*m.res*m.res,pz:pk,score:sc,sign:sg>0?"+":"-"})}}
 out.sort((a,b)=>b.score-a.score);out.forEach((t,i)=>t.id=i+1);return out}

/* ---------- map building for sphere ---------- */
function sphereMaps(d,useSat){
 const R=d.R*1.001;
 const pts=d.P.filter(p=>p.z3===undefined&&p.u[2]<=0&&(useSat||!p.sat)).map(p=>[p.x,p.y,Math.max(-12,Math.min(12,p.z))]);
 d.map=idw(pts,-R,R,-R,R,300,300,R*0.07,"");
 // az/el
 const pu=d.P.filter(p=>useSat||!p.sat),AW=360,AH=180,F=new Float32Array(AW*AH);
 const cell=4,bins=new Map();pu.forEach(p=>{const k=Math.floor((p.az+180)/cell)+"_"+Math.floor((p.el+90)/cell);if(!bins.has(k))bins.set(k,[]);bins.get(k).push(p)});
 for(let j=0;j<AH;j++)for(let i=0;i<AW;i++){const az=-180+i,el=-90+j;let nu=0,de=0;const ca=Math.cos(el*Math.PI/180),u=[ca*Math.cos(az*Math.PI/180),ca*Math.sin(az*Math.PI/180),Math.sin(el*Math.PI/180)];
  const bi=Math.floor((az+180)/cell),bj=Math.floor((el+90)/cell);
  for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++){const k=(((bi+a)%90+90)%90)+"_"+(bj+b);const arr=bins.get(k);if(!arr)continue;for(const p of arr){const dd=Math.acos(Math.max(-1,Math.min(1,u[0]*p.u[0]+u[1]*p.u[1]+u[2]*p.u[2])))*180/Math.PI;if(dd>6)continue;const w=Math.exp(-((dd/2.5)**2));nu+=w*Math.max(-10,Math.min(10,p.z));de+=w}}
  F[j*AW+i]=de>1e-6?nu/de:NaN}
 d.dir={W:AW,H:AH,F};
}

/* ---------- rendering ---------- */
function renderSurfer(cv,m,floor,pal,pol){
 const cols=PAL[pal].map(hex),k=cols.length,{W,H,F}=m;
 let top=0;const T=new Float32Array(W*H);for(let i=0;i<W*H;i++){const v=pol==="abs"?Math.abs(F[i]):pol==="low"?-F[i]:F[i];T[i]=v;if(v>top)top=v}
 if(top<floor*1.6){const sc0=Math.max(1,Math.floor(900/Math.max(W,H)));cv.width=W*sc0;cv.height=H*sc0;const c0=cv.getContext("2d"),im=c0.createImageData(cv.width,cv.height);
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){const c=rdbu(F[j*W+i]*3);for(let a=0;a<sc0;a++)for(let b=0;b<sc0;b++){const q=((H-1-j)*sc0+a)*cv.width+i*sc0+b;im.data[q*4]=c[0];im.data[q*4+1]=c[1];im.data[q*4+2]=c[2];im.data[q*4+3]=255}}
  c0.putImageData(im,0,0);c0.fillStyle="#000";c0.font="bold 15px sans-serif";c0.fillText("هیچ ناحیه‌ای بالاتر از آستانه z نیست — نقشه ضعیف z نشان داده شده (احتمالاً نویز، نه هدف)",8,20);lastMap={x0:m.x0,x1:m.x1,y0:m.y0,y1:m.y1,sc:sc0,W,H};return}
 top=Math.max(top,floor+1);const lv=[floor];for(let i=1;i<k;i++)lv.push(floor+(top-floor)*Math.pow(i/(k-1),1.3)*1);
 const band=v=>{if(v<floor)return -1;let b=0;for(let i=1;i<k;i++)if(v>=lv[i])b=i;return b};
 const sc=Math.max(1,Math.floor(900/Math.max(W,H)));cv.width=W*sc;cv.height=H*sc;
 const ctx=cv.getContext("2d");const bg=ctx.createLinearGradient(0,0,cv.width,cv.height);bg.addColorStop(0,"#6e5d4b");bg.addColorStop(1,"#4e4538");ctx.fillStyle=bg;ctx.fillRect(0,0,cv.width,cv.height);
 const img=ctx.getImageData(0,0,cv.width,cv.height),D=img.data,B=new Int8Array(W*H);for(let i=0;i<W*H;i++)B[i]=band(T[i]);
 for(let j=0;j<H;j++)for(let i=0;i<W;i++){const b=B[j*W+i];if(b<0)continue;let c=cols[b];
  const e=(i<W-1&&B[j*W+i+1]!==b)||(j<H-1&&B[(j+1)*W+i]!==b)||(i>0&&B[j*W+i-1]!==b)||(j>0&&B[(j-1)*W+i]!==b);
  const outer=(i>0&&B[j*W+i-1]<0)||(i<W-1&&B[j*W+i+1]<0)||(j>0&&B[(j-1)*W+i]<0)||(j<H-1&&B[(j+1)*W+i]<0);
  if(outer)c=cols[0];else if(e&&b>0)c=c.map(v=>v*0.55);
  for(let a=0;a<sc;a++)for(let bb=0;bb<sc;bb++){const px=((H-1-j)*sc+a)*cv.width+i*sc+bb;D[px*4]=c[0];D[px*4+1]=c[1];D[px*4+2]=c[2];D[px*4+3]=255}}
 ctx.putImageData(img,0,0);
 ctx.fillStyle="#fff";ctx.font="14px sans-serif";ctx.fillText(m.unit==="m"?`${(m.x1-m.x0).toFixed(1)} × ${(m.y1-m.y0).toFixed(1)} m`:"نمای از بالا (نیمکره پایین)",8,18);

function rdbu(v){const t=Math.max(-1,Math.min(1,v/10));const a=Math.abs(t);return t>=0?[255,255-a*190|0,255-a*200|0]:[255-a*210|0,255-a*150|0,255]}
function renderDir(cv,m,tg){const{W,H,F}=m,s=2;cv.width=W*s;cv.height=H*s;const ctx=cv.getContext("2d"),img=ctx.createImageData(cv.width,cv.height);
 for(let j=0;j<H;j++)for(let i=0;i<W;i++){const v=F[j*W+i],c=isNaN(v)?[200,200,200]:rdbu(v);for(let a=0;a<s;a++)for(let b=0;b<s;b++){const p=((H-1-j)*s+a)*cv.width+i*s+b;img.data[p*4]=c[0];img.data[p*4+1]=c[1];img.data[p*4+2]=c[2];img.data[p*4+3]=255}}
 ctx.putImageData(img,0,0);ctx.strokeStyle="#0f0";ctx.fillStyle="#0f0";ctx.lineWidth=2;ctx.font="bold 15px sans-serif";
 (tg||[]).slice(0,12).forEach(t=>{const x=(t.az+180)*s,y=(90-t.el)*s;ctx.beginPath();ctx.arc(x,y,12,0,7);ctx.stroke();ctx.fillText(t.id,x+14,y-8)});
 ctx.fillStyle="#000";ctx.fillText("Azimuth −180…180  /  Elevation −90…90 (خاکستری = بدون داده)",8,16)}
function render3D(){
 const cv=$("c_3d"),ctx=cv.getContext("2d"),Wd=cv.width,Hd=cv.height;ctx.fillStyle="#05080c";ctx.fillRect(0,0,Wd,Hd);if(!cur)return;
 let pts=[];
 if(cur.type==="sphere"){const R=cur.R;for(const p of cur.P){if(p.sat&&!$("sat").checked)continue;pts.push([p.x/R,p.y/R,p.z3||p.u[2],p.z])}}
 else{const m=cur.map,sx=Math.max(1,Math.floor(m.W/150)),sy=Math.max(1,Math.floor(m.H/80)),L=Math.max(m.x1-m.x0,m.y1-m.y0);
  for(let j=0;j<m.H;j+=sy)for(let i=0;i<m.W;i+=sx){const z=m.F[j*m.W+i];pts.push([((i*m.res)-(m.x1-m.x0)/2)/L*2,((j*m.res)-(m.y1-m.y0)/2)/L*2,Math.max(-1,Math.min(1,z/10))*0.5,z])}}
 const cx=Math.cos(view.rx),sx_=Math.sin(view.rx),cz=Math.cos(view.rz),sz=Math.sin(view.rz),S=Math.min(Wd,Hd)*0.38*view.zoom;
 const pr=pts.map(p=>{let x=p[0]*cz-p[1]*sz,y=p[0]*sz+p[1]*cz,z=p[2];const y2=y*cx-z*sx_,z2=y*sx_+z*cx;return{x:Wd/2+x*S,y:Hd/2-y2*S,d:z2,v:p[3]}}).sort((a,b)=>a.d-b.d);
 for(const q of pr){const c=rdbu(q.v);ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;ctx.fillRect(q.x,q.y,cur.type==="sphere"?3:4,cur.type==="sphere"?3:4)}
 ctx.fillStyle="#9aa4af";ctx.font="13px sans-serif";ctx.fillText(cur.type==="sphere"?"کره اسکن (قرمز=بالاتر از پایه، آبی=پایین‌تر)":"سطح z-score (ارتفاع = شدت)",8,18)}
(()=>{const cv=$("c_3d");let dn=false,lx,ly;cv.onmousedown=e=>{dn=true;lx=e.clientX;ly=e.clientY};window.onmouseup=()=>dn=false;

 cv.onwheel=e=>{e.preventDefault();view.zoom=Math.max(0.3,Math.min(5,view.zoom*(e.deltaY<0?1.1:0.9)));render3D()}})();

/* ---------- UI ---------- */
const TABS={map:"نقشه سبک سورفر",v3d:"سه‌بعدی (سبک وکسلر)",dir:"نقشه جهت‌ها",rep:"اهداف و گزارش"};
function buildTabs(){$("tabs").innerHTML=Object.entries(TABS).filter(([k])=>k!=="dir"||(cur&&cur.type==="sphere")).map(([k,v])=>`<div class="tab ${k===tab?"on":""}" onclick="setTab('${k}')">${v}</div>`).join("")}
function setTab(k){tab=k;["map","3d","dir","rep"].forEach(n=>$("v_"+n).classList.add("hide"));$("v_"+(k==="v3d"?"3d":k)).classList.remove("hide");buildTabs();if(k==="v3d")render3D()}
function run(){
 if(!cur)return;const zt=+$("zt").value,useSat=$("sat").checked;
 try{
  if(cur.type==="sphere"){analyzeSphere(cur,zt,+$("lk").value,useSat);sphereMaps(cur,useSat);renderDir($("c_dir"),cur.dir,cur.targets)}
  else analyzeGrid(cur,zt,useSat);
 }catch(e){$("info").className="note warn";$("info").textContent="خطا: "+e.message;return}
 renderSurfer($("c_map"),cur.map,zt,$("pal").value,$("pol").value);
 report();setTab(tab);
}
function report(){
 const d=cur;let h=`<b>${d.name}</b> — `;
 if(d.type==="sphere")h+=`اسکن کره‌ای، ${d.P.length} نقطه، شعاع ${d.R.toFixed(0)}`+(d.satVal!==null?`<br>مقدار ثابت ${d.satVal} (${(100*d.P.filter(p=>p.sat).length/d.P.length).toFixed(0)}٪ نقاط) به‌عنوان «بدون سیگنال» کنار گذاشته شد`:"");
 else h+=d.kind==="okm"?`OKM: ${d.lines} خط × ${d.n} نمونه، ${d.L}×${d.W} متر، نمونه‌های دارای شیب نامعتبر ${d.badPct.toFixed(1)}٪`:`اسکن شبکه‌ای، ${d.P.length} نقطه`;
 h+=`<br>مقیاس نویز (robust σ): ${d.scale.toFixed(1)}`;$("info").className="note";$("info").innerHTML=h;
 let r="";if(d.moran)r+=`<div class="note ${d.moran.p<0.05&&d.moran.I>0.1?"":"warn"}">Moran I = ${d.moran.I.toFixed(2)} ، p = ${d.moran.p.toFixed(2)} — ${d.moran.p<0.05&&d.moran.I>0.1?"الگوی داده از نظر مکانی منسجم است (نویز تصادفی نیست)":"انسجام مکانی ضعیف؛ شبیه نویز"}</div>`;
 const T=d.targets;r+=T.length?"<table><tr>"+(d.type==="sphere"?"<th>#</th><th>تعداد</th><th>Azimuth</th><th>Elev</th><th>گستره°</th><th>پیک</th><th>پیک z</th><th>امتیاز</th></tr>"+T.map(t=>`<tr><td>${t.id}</td><td>${t.n}</td><td>${t.az.toFixed(1)}</td><td>${t.el.toFixed(1)}</td><td>${t.spread.toFixed(1)}</td><td>${t.peak.toFixed(0)}</td><td>${t.pz.toFixed(1)}</td><td>${t.score.toFixed(0)}</td></tr>`).join(""):"<th>#</th><th>x (m)</th><th>y (m)</th><th>مساحت m²</th><th>پیک z</th><th>علامت</th><th>امتیاز</th></tr>"+T.map(t=>`<tr><td>${t.id}</td><td>${t.x.toFixed(2)}</td><td>${t.y.toFixed(2)}</td><td>${t.area.toFixed(2)}</td><td>${t.pz.toFixed(1)}</td><td>${t.sign}</td><td>${t.score.toFixed(0)}</td></tr>`).join(""))+"</table>":'<div class="note">هیچ ناحیه‌ای بالای آستانه پیدا نشد.</div>';
 const ok=DS.filter(x=>x!==d&&x.type===d.type&&x.map&&d.map);if(ok.length)r+=`<div class="note">${ok.map(o=>`تکرارپذیری با «${o.name}»: ${repeat(d,o)}`).join("<br>")}</div>`;
 r+=`<div class="note warn">توجه: این نرم‌افزار فقط الگوی آماری را نشان می‌دهد و مبنای مستقلی برای تعیین نوع هدف (حفره، فلز، طلا ...) ندارد. اعتبار فقط با تکرار اسکن از همان محل و آزمون روی هدف معلوم ثابت می‌شود.</div>`;
 $("rep").innerHTML=r}
function repeat(a,b){try{let x,y;if(a.type==="grid"){const n=Math.min(a.map.F.length,b.map.F.length);if(a.map.W!==b.map.W||a.map.H!==b.map.H)return"ابعاد دو اسکن یکسان نیست";x=a.map.F;y=b.map.F}else{x=a.map.F;y=b.map.F}
 const n=x.length;let mx=0,my=0;for(let i=0;i<n;i++){mx+=x[i];my+=y[i]}mx/=n;my/=n;let sxy=0,sxx=0,syy=0;for(let i=0;i<n;i++){sxy+=(x[i]-mx)*(y[i]-my);sxx+=(x[i]-mx)**2;syy+=(y[i]-my)**2}
 const r=sxy/Math.sqrt(sxx*syy);return `r = ${r.toFixed(2)} (${r>0.7?"تکرارپذیر":r>0.4?"متوسط":"ضعیف/اتفاقی"})`}catch(e){return"نامشخص"}}

/* ---------- files ---------- */
async function loadFiles(files){
 for(const f of files){try{const buf=await f.arrayBuffer();const d=/\.okm$/i.test(f.name)?parseOKM(buf,f.name):parseCSV(new TextDecoder().decode(buf),f.name);DS.push(d);cur=d}
  catch(e){alert(f.name+": "+e.message)}}
 if(cur){$("drop").classList.add("hide");$("views").classList.remove("hide");buildTabs();run()}
}
$("fi").onchange=e=>loadFiles(e.target.files);

function expKML(){if(!cur||!cur.map)return;const lat=+$("lat").value,lon=+$("lon").value;if(!lat||!lon){alert("lat و lon مرکز را وارد کن");return}
 const m=cur.map,hx=(m.x1-m.x0)/2||cur.R,hy=(m.y1-m.y0)/2||cur.R,dl=hy/111320,dn=hx/(111320*Math.cos(lat*Math.PI/180)),nm=cur.name+".png";expPNG();
